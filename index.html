<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Telegram Poker</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{

margin:0;

background:
radial-gradient(
circle at top,
#263d30 0%,
#101611 50%,
#060806 100%
);

color:white;

font-family:
Arial,
Helvetica,
sans-serif;

min-height:100vh;

overflow:hidden;
}

button{

border:0;
color:white;
font-weight:800;
cursor:pointer;
}

button:active{
transform:scale(.96);
}

button:disabled{
opacity:.3;
}

/* =====================================================
HEADER
===================================================== */

.header{

height:58px;

display:flex;

align-items:center;

justify-content:space-between;

padding:
0 14px;

background:
rgba(0,0,0,.4);

border-bottom:
1px solid
rgba(255,255,255,.08);

}

.logo{

font-size:19px;
font-weight:900;

}

.status{

font-size:11px;
color:#7cff91;

}

/* =====================================================
LOBBY
===================================================== */

#lobby{

position:fixed;

inset:0;

z-index:100;

background:

radial-gradient(
circle at top,
#193b28,
#080c09 70%
);

padding:
25px 15px;

overflow-y:auto;

}

.lobby-title{

font-size:30px;
font-weight:900;
text-align:center;

margin-top:20px;

}

.lobby-sub{

text-align:center;

color:#aeb9b1;

font-size:12px;

margin-top:6px;
margin-bottom:25px;

}

.tables{

display:flex;

flex-direction:column;

gap:12px;

max-width:520px;

margin:auto;

}

.table-card{

background:
linear-gradient(
145deg,
rgba(35,52,42,.95),
rgba(12,20,15,.95)
);

border:
1px solid
rgba(255,255,255,.1);

border-radius:18px;

padding:17px;

box-shadow:
0 10px 25px
rgba(0,0,0,.35);

}

.table-top{

display:flex;

justify-content:space-between;

align-items:center;

}

.table-name{

font-size:18px;
font-weight:900;

}

.badge{

font-size:10px;

padding:
5px 9px;

border-radius:20px;

font-weight:900;
}

.badge.open{

background:#125c36;
color:#7dffad;

}

.badge.playing{

background:#665014;
color:#ffe26a;

}

.badge.full{

background:#63272c;
color:#ff969d;

}

.table-info{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:8px;

margin-top:14px;

}

.info-box{

background:
rgba(0,0,0,.25);

border-radius:10px;

padding:9px;

text-align:center;

}

.info-title{

font-size:9px;
color:#89958e;

}

.info-value{

font-size:13px;
font-weight:900;

margin-top:3px;

}

.join-table{

width:100%;

margin-top:13px;

padding:12px;

border-radius:11px;

background:
linear-gradient(
135deg,
#19a860,
#08733d
);

font-size:14px;

box-shadow:
0 5px 16px
rgba(0,0,0,.25);

}

.join-table:disabled{

background:#333;

}

/* =====================================================
GAME
===================================================== */

#gameScreen{

display:none;

height:100vh;

}

.table-area{

height:
calc(100vh - 210px);

min-height:430px;

position:relative;

display:flex;

align-items:center;

justify-content:center;

}

.table{

width:92%;

max-width:650px;

aspect-ratio:1.65;

background:

radial-gradient(
circle,
#1a9555,
#09653a 60%,
#064126
);

border:
14px solid #57351f;

border-radius:50%;

box-shadow:

inset 0 0 40px
rgba(0,0,0,.55),

0 20px 50px
rgba(0,0,0,.55);

position:relative;

}

.table:after{

content:"";

position:absolute;

inset:7px;

border:
2px solid
rgba(255,255,255,.08);

border-radius:50%;

}

/* =====================================================
CENTER
===================================================== */

.center{

position:absolute;

top:50%;
left:50%;

transform:
translate(-50%,-50%);

text-align:center;

z-index:3;

}

.pot{

font-size:20px;

font-weight:900;

text-shadow:
0 2px 5px
rgba(0,0,0,.5);

}

.stage{

font-size:10px;

opacity:.7;

margin-top:4px;

letter-spacing:1px;

}

.community{

display:flex;

justify-content:center;

gap:5px;

margin-top:9px;

}

/* =====================================================
CARDS
===================================================== */

.card{

width:42px;
height:58px;

background:white;

color:#111;

border-radius:7px;

display:flex;

align-items:center;

justify-content:center;

font-size:20px;

font-weight:900;

box-shadow:
0 4px 9px
rgba(0,0,0,.45);

animation:
cardIn .25s ease;

}

.card.red{
color:#d21f2b;
}

.card.back{

background:
linear-gradient(
135deg,
#162b66,
#3456a4
);

border:
2px solid white;

color:white;

}

@keyframes cardIn{

from{
transform:
translateY(-12px)
scale(.8);

opacity:0;
}

to{
transform:
translateY(0)
scale(1);

opacity:1;
}

}

/* =====================================================
PLAYERS
===================================================== */

.player{

position:absolute;

width:105px;

text-align:center;

transform:
translate(-50%,-50%);

z-index:5;

}

.player-box{

background:
rgba(0,0,0,.58);

border:
1px solid
rgba(255,255,255,.12);

border-radius:13px;

padding:6px;

backdrop-filter:blur(6px);

transition:.25s;

}

.player.turn .player-box{

border:
2px solid #ffd83d;

box-shadow:

0 0 12px
rgba(255,216,61,.7),

0 0 30px
rgba(255,216,61,.25);

transform:scale(1.06);

}

.player.me .player-box{

border-color:#48a8ff;

}

.player-name{

font-size:11px;

font-weight:900;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

}

.player-chips{

font-size:10px;

color:#d2ddd7;

margin-top:2px;

}

.player-cards{

display:flex;

justify-content:center;

margin-top:4px;

}

.player-cards .card + .card{

margin-left:-10px;

}

.seat0{

left:50%;
bottom:-18px;

}

.seat1{

left:9%;
bottom:10%;

}

.seat2{

left:4%;
top:20%;

}

.seat3{

left:50%;
top:-18px;

}

.seat4{

right:-5%;
top:20%;

}

.seat5{

right:0%;
bottom:10%;

}

/* =====================================================
TIMER
===================================================== */

.timer{

position:absolute;

top:-31px;

left:50%;

transform:
translateX(-50%);

width:38px;
height:38px;

border-radius:50%;

background:
rgba(0,0,0,.8);

border:
2px solid #ffd83d;

display:none;

align-items:center;

justify-content:center;

font-size:13px;

font-weight:900;

color:#fff;

box-shadow:
0 0 14px
rgba(255,216,61,.5);

}

.player.turn .timer{

display:flex;

}

.player.turn .timer.danger{

border-color:#ff4e55;

color:#ff7479;

box-shadow:
0 0 16px
rgba(255,70,80,.7);

}

/* =====================================================
MY CARDS
===================================================== */

.my-cards-area{

position:absolute;

left:50%;

bottom:68px;

transform:
translateX(-50%);

text-align:center;

z-index:10;

}

.my-title{

font-size:10px;

opacity:.65;

margin-bottom:5px;

}

.my-cards{

display:flex;

justify-content:center;

gap:6px;

}

/* =====================================================
CONTROLS
===================================================== */

.controls{

position:fixed;

left:0;
right:0;
bottom:0;

min-height:105px;

padding:
8px 10px 12px;

background:
rgba(7,11,9,.97);

border-top:
1px solid
rgba(255,255,255,.1);

z-index:30;

}

.actions{

display:grid;

grid-template-columns:
repeat(4,1fr);

gap:6px;

}

.action-btn{

padding:12px 3px;

border-radius:10px;

font-size:11px;

}

.fold{
background:#633239;
}

.check{
background:#287c49;
}

.call{
background:#276ca9;
}

.raise{
background:#9b6b16;
}

.allin{
background:#a72f36;
}

.bottom-row{

display:flex;

justify-content:center;

gap:7px;

margin-top:7px;

}

.small-btn{

background:#242b27;

padding:7px 13px;

border-radius:9px;

font-size:10px;

}

/* =====================================================
TOP TABLE BAR
===================================================== */

.table-bar{

height:43px;

display:flex;

align-items:center;

justify-content:space-between;

padding:
0 10px;

background:
rgba(0,0,0,.25);

}

.back-lobby{

background:#252c28;

padding:7px 11px;

border-radius:8px;

font-size:10px;

}

.table-label{

font-size:13px;

font-weight:900;

}

/* =====================================================
LOADING
===================================================== */

.loading{

position:fixed;

inset:0;

z-index:300;

background:
rgba(0,0,0,.65);

display:none;

align-items:center;

justify-content:center;

}

.loading.show{
display:flex;
}

.loader{

background:#18201b;

padding:18px 25px;

border-radius:14px;

font-weight:800;

}

/* =====================================================
TOAST
===================================================== */

.toast{

position:fixed;

top:65px;

left:50%;

transform:
translateX(-50%);

background:
rgba(0,0,0,.88);

padding:
9px 15px;

border-radius:10px;

font-size:11px;

display:none;

z-index:400;

}

.toast.show{
display:block;
}

/* =====================================================
MOBILE
===================================================== */

@media(max-width:430px){

.table-area{

height:
calc(100vh - 200px);

min-height:390px;

}

.table{

width:94%;

border-width:10px;

}

.player{

width:82px;

}

.player-name{

font-size:9px;

}

.player-chips{

font-size:8px;

}

.card{

width:35px;

height:49px;

font-size:17px;

}

.pot{

font-size:17px;

}

.community{

gap:3px;

}

.community .card{

width:34px;

height:47px;

font-size:16px;

}

}

</style>

</head>

<body>

<!-- =====================================================
LOBBY
===================================================== -->

<div id="lobby">

<div class="lobby-title">
♠ Poker Lobby
</div>

<div class="lobby-sub">
Choose a table and join the game
</div>

<div id="tables"
class="tables">
</div>

</div>


<!-- =====================================================
GAME
===================================================== -->

<div id="gameScreen">

<div class="header">

<div class="logo">
♠ Telegram Poker
</div>

<div id="status"
class="status">
Connecting...
</div>

</div>


<div class="table-bar">

<button
class="back-lobby"
onclick="backToLobby()">

← TABLES

</button>

<div id="tableLabel"
class="table-label">
TABLE 1
</div>

<div>
🪙 <span id="myChips">1000</span>
</div>

</div>


<div class="table-area">

<div class="table">

<div
id="seat0"
class="player seat0">
</div>

<div
id="seat1"
class="player seat1">
</div>

<div
id="seat2"
class="player seat2">
</div>

<div
id="seat3"
class="player seat3">
</div>

<div
id="seat4"
class="player seat4">
</div>

<div
id="seat5"
class="player seat5">
</div>


<div class="center">

<div class="pot">

🪙 Pot:
<span id="pot">0</span>

</div>

<div
id="stage"
class="stage">

WAITING

</div>

<div
id="community"
class="community">
</div>

</div>

</div>


<div class="my-cards-area">

<div class="my-title">
YOUR CARDS
</div>

<div
id="myCards"
class="my-cards">
</div>

</div>

</div>


<div class="controls">

<div class="actions">

<button
id="foldBtn"
class="action-btn fold"
onclick="doAction('fold')">

FOLD

</button>

<button
id="checkBtn"
class="action-btn check"
onclick="doAction('check')">

CHECK

</button>

<button
id="callBtn"
class="action-btn call"
onclick="doAction('call')">

CALL

</button>

<button
id="raiseBtn"
class="action-btn raise"
onclick="raiseAction()">

RAISE

</button>

</div>


<div class="bottom-row">

<button
class="small-btn allin"
onclick="doAction('allin')">

ALL-IN

</button>

<button
class="small-btn"
onclick="startGame()">

START

</button>

</div>

</div>

</div>


<!-- =====================================================
LOADING
===================================================== -->

<div
id="loading"
class="loading">

<div class="loader">
♠ Connecting...
</div>

</div>


<div
id="toast"
class="toast">
</div>


<script>

const tg =
window.Telegram.WebApp;

tg.ready();
tg.expand();

const API =
"https://telegram-poker-backend2.onrender.com";

let userId = null;

let userName =
"Player";

let currentTable = null;

let gameState = null;

let pollTimer = null;


/* =====================================================
USER
===================================================== */

function getTelegramUser(){

const user =
tg.initDataUnsafe &&
tg.initDataUnsafe.user;

if(user){

userId =
String(user.id);

userName =
user.first_name ||
user.username ||
"Player";

return;

}

let saved =
localStorage.getItem(
"poker_test_user"
);

if(!saved){

saved =
"test_" +
Math.floor(
Math.random()*1000000
);

localStorage.setItem(
"poker_test_user",
saved
);

}

userId = saved;

userName =
"Test Player";

}


/* =====================================================
API
===================================================== */

async function api(
path,
options={}
){

const response =
await fetch(
API + path,
{

...options,

headers:{
"Content-Type":
"application/json",

...(options.headers || {})

}

});

const data =
await response.json();

if(!response.ok){

throw new Error(
data.detail ||
"Server error"
);

}

return data;

}


/* =====================================================
TOAST
===================================================== */

function showToast(
message
){

const toast =
document.getElementById(
"toast"
);

toast.innerText =
message;

toast.classList.add(
"show"
);

setTimeout(
()=>{
toast.classList.remove(
"show"
);
},
2200
);

}


/* =====================================================
LOADING
===================================================== */

function setLoading(
show
){

document
.getElementById(
"loading"
)
.classList.toggle(
"show",
show
);

}


/* =====================================================
LOBBY
===================================================== */

async function loadTables(){

try{

const data =
await api(
"/tables"
);

renderTables(
data.tables || []
);

}catch(error){

console.error(error);

showToast(
"Cannot load tables"
);

}

}


function renderTables(
tables
){

const container =
document.getElementById(
"tables"
);

container.innerHTML = "";

tables.forEach(
table=>{

const card =
document.createElement(
"div"
);

card.className =
"table-card";

let badgeClass =
"open";

if(
table.status ===
"PLAYING"
)
badgeClass =
"playing";

if(
table.status ===
"FULL"
)
badgeClass =
"full";

const disabled =
table.status ===
"FULL";

card.innerHTML = `

<div class="table-top">

<div class="table-name">
♠ ${table.name}
</div>

<div class="badge ${badgeClass}">
${table.status}
</div>

</div>

<div class="table-info">

<div class="info-box">

<div class="info-title">
PLAYERS
</div>

<div class="info-value">
${table.players}/${table.max_players}
</div>

</div>

<div class="info-box">

<div class="info-title">
BLINDS
</div>

<div class="info-value">
${table.small_blind}/${table.big_blind}
</div>

</div>

<div class="info-box">

<div class="info-title">
POT
</div>

<div class="info-value">
${table.pot}
</div>

</div>

</div>

<button
class="join-table"
${disabled ? "disabled":""}
onclick="joinTable(${table.id})">

${disabled ? "FULL" : "JOIN TABLE"}

</button>

`;

container.appendChild(
card
);

});

}


/* =====================================================
JOIN TABLE
===================================================== */

async function joinTable(
tableId
){

try{

setLoading(true);

await api(
"/join",
{

method:"POST",

body:
JSON.stringify({

user_id:
userId,

name:
userName,

table_id:
tableId

})

});

currentTable =
tableId;

document
.getElementById(
"lobby"
)
.style.display =
"none";

document
.getElementById(
"gameScreen"
)
.style.display =
"block";

document
.getElementById(
"tableLabel"
)
.innerText =
"TABLE " +
tableId;

document
.getElementById(
"status"
)
.innerText =
"Connected";

await refreshGame();

startPolling();

showToast(
"Joined Table " +
tableId
);

}catch(error){

showToast(
error.message
);

}finally{

setLoading(false);

}

}


/* =====================================================
BACK TO LOBBY
===================================================== */

async function backToLobby(){

try{

if(currentTable){

await api(
"/leave?user_id=" +
encodeURIComponent(
userId
) +
"&table_id=" +
currentTable,
{
method:"POST"
}
);

}

}catch(error){

console.log(
"Leave:",
error.message
);

}

stopPolling();

currentTable =
null;

gameState =
null;

document
.getElementById(
"gameScreen"
)
.style.display =
"none";

document
.getElementById(
"lobby"
)
.style.display =
"block";

loadTables();

}


/* =====================================================
REFRESH GAME
===================================================== */

async function refreshGame(){

if(!currentTable)
return;

try{

const data =
await api(
"/game?table_id=" +
currentTable +
"&user_id=" +
encodeURIComponent(
userId
)
);

gameState =
data;

renderGame(
data
);

}catch(error){

console.error(
error
);

document
.getElementById(
"status"
)
.innerText =
"Offline";

}

}


/* =====================================================
START
===================================================== */

async function startGame(){

if(!currentTable)
return;

try{

setLoading(true);

const data =
await api(
"/start?table_id=" +
currentTable,
{
method:"POST"
}
);

gameState =
data;

renderGame(
data
);

showToast(
"Game started!"
);

}catch(error){

showToast(
error.message
);

}finally{

setLoading(false);

}

}


/* =====================================================
ACTION
===================================================== */

async function doAction(
action
){

if(!gameState)
return;

if(
gameState.current_player
!== userId
){

showToast(
"It's not your turn"
);

return;

}

try{

setLoading(true);

const data =
await api(
"/action",
{

method:"POST",

body:
JSON.stringify({

user_id:
userId,

action:
action,

amount:0,

table_id:
currentTable

})

});

gameState =
data;

renderGame(
data
);

}catch(error){

showToast(
error.message
);

}finally{

setLoading(false);

}

}


/* =====================================================
RAISE
===================================================== */

async function raiseAction(){

if(!gameState)
return;

if(
gameState.current_player
!== userId
){

showToast(
"It's not your turn"
);

return;

}

const current =
Number(
gameState.current_bet ||
20
);

const amount =
prompt(
"Raise to:",
String(
current + 20
)
);

if(!amount)
return;

const raiseTo =
Number(amount);

if(
!Number.isFinite(
raiseTo
)
){

showToast(
"Invalid amount"
);

return;

}

try{

setLoading(true);

const data =
await api(
"/action",
{

method:"POST",

body:
JSON.stringify({

user_id:
userId,

action:
"raise",

amount:
raiseTo,

table_id:
currentTable

})

});

gameState =
data;

renderGame(
data
);

}catch(error){

showToast(
error.message
);

}finally{

setLoading(false);

}

}


/* =====================================================
CARD
===================================================== */

function createCard(
card
){

const div =
document.createElement(
"div"
);

div.className =
"card";

if(
card &&
(
card.includes("♥") ||
card.includes("♦")
)
){

div.classList.add(
"red"
);

}

div.innerText =
card;

return div;

}


function createBack(){

const div =
document.createElement(
"div"
);

div.className =
"card back";

div.innerText =
"♠";

return div;

}


/* =====================================================
PLAYERS
===================================================== */

function renderPlayers(
players
){

for(
let seat=0;
seat<6;
seat++
){

const box =
document.getElementById(
"seat" + seat
);

box.innerHTML = "";

box.classList.remove(
"me",
"turn"
);

const player =
players.find(
p=>p.seat === seat
);

if(!player)
continue;

if(
player.user_id === userId
){

box.classList.add(
"me"
);

}

if(
player.is_turn
){

box.classList.add(
"turn"
);

}

const container =
document.createElement(
"div"
);

container.className =
"player-box";


/* TIMER */

const timer =
document.createElement(
"div"
);

timer.className =
"timer";

timer.innerText =
player.is_turn
? (
gameState
? gameState.turn_remaining
: 25
)
: "";

if(
player.is_turn &&
gameState &&
gameState.turn_remaining <= 5
){

timer.classList.add(
"danger"
);

}

container.appendChild(
timer
);


/* NAME */

const name =
document.createElement(
"div"
);

name.className =
"player-name";

name.innerText =
player.name +
(
player.is_bot
? " 🤖"
: ""
);

container.appendChild(
name
);


/* CHIPS */

const chips =
document.createElement(
"div"
);

chips.className =
"player-chips";

chips.innerText =
"🪙 " +
player.chips;

container.appendChild(
chips
);


/* CARDS */

const cards =
document.createElement(
"div"
);

cards.className =
"player-cards";

if(
player.user_id !== userId &&
player.cards_count >= 2
){

cards.appendChild(
createBack()
);

cards.appendChild(
createBack()
);

}

container.appendChild(
cards
);

box.appendChild(
container
);

}

}


/* =====================================================
COMMUNITY
===================================================== */

function renderCommunity(
cards
){

const container =
document.getElementById(
"community"
);

container.innerHTML = "";

cards.forEach(
card=>{

container.appendChild(
createCard(card)
);

});

}


/* =====================================================
MY CARDS
===================================================== */

function renderMyCards(
cards
){

const container =
document.getElementById(
"myCards"
);

container.innerHTML = "";

if(!cards.length){

container.appendChild(
createBack()
);

container.appendChild(
createBack()
);

return;

}

cards.forEach(
card=>{

container.appendChild(
createCard(card)
);

});

}


/* =====================================================
GAME RENDER
===================================================== */

function renderGame(
data
){

if(!data)
return;

document
.getElementById(
"pot"
)
.innerText =
data.pot || 0;

document
.getElementById(
"stage"
)
.innerText =
String(
data.stage ||
"waiting"
)
.toUpperCase();

renderPlayers(
data.players || []
);

renderCommunity(
data.community_cards || []
);

renderMyCards(
data.my_cards || []
);


/* MY CHIPS */

const me =
(data.players || [])
.find(
p =>
p.user_id === userId
);

if(me){

document
.getElementById(
"myChips"
)
.innerText =
me.chips;

}


/* BUTTONS */

const myTurn =
data.current_player ===
userId;

document
.querySelectorAll(
".actions button"
)
.forEach(
button=>{

button.disabled =
!myTurn ||
!data.started;

}
);


/* WINNER */

if(
!data.started &&
data.winner &&
data.message
){

showToast(
data.message
);

}

}


/* =====================================================
POLLING
===================================================== */

function startPolling(){

stopPolling();

pollTimer =
setInterval(
()=>{

refreshGame();

},
1000
);

}

function stopPolling(){

if(pollTimer){

clearInterval(
pollTimer
);

pollTimer =
null;

}

}


/* =====================================================
LOBBY POLLING
===================================================== */

setInterval(
()=>{

if(
document
.getElementById(
"lobby"
)
.style.display !==
"none"
){

loadTables();

}

},
3000
);


/* =====================================================
INIT
===================================================== */

async function init(){

getTelegramUser();

await loadTables();

}

init();

</script>

</body>
</html>
