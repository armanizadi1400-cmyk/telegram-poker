<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Texas Hold'em Poker</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(
            circle at top,
            #155b3b 0%,
            #061a11 70%
        );
    color: white;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
}

#app {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 12px;
}

/* =========================
   TABLE SELECT
========================= */

h1 {
    text-align: center;
    margin: 5px 0 10px;
    font-size: 25px;
}

#status {
    text-align: center;
    font-size: 13px;
    opacity: .85;
    margin-bottom: 12px;
}

#tables {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.table-button {
    border: 1px solid #ffffff35;
    background:
        linear-gradient(
            145deg,
            #17633f,
            #0a3020
        );
    color: white;
    padding: 16px 8px;
    border-radius: 15px;
    font-size: 16px;
    font-weight: bold;
    box-shadow:
        0 5px 15px #0008;
}

.table-button:active {
    transform: scale(.97);
}

/* =========================
   GAME
========================= */

#game {
    display: none;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
}

.back {
    border: 1px solid #ffffff35;
    background: #ffffff16;
    color: white;
    padding: 8px 12px;
    border-radius: 10px;
}

.table-title {
    font-weight: bold;
}

/* =========================
   POKER TABLE
========================= */

.poker-table {
    position: relative;
    width: 100%;
    height: 570px;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse at center,
            #197047 0%,
            #0e512f 52%,
            #062b1c 100%
        );

    border: 12px solid #573719;

    box-shadow:
        inset 0 0 0 4px #a97638,
        inset 0 0 35px #0008,
        0 15px 35px #0009;

    overflow: hidden;
}

/* =========================
   CENTER
========================= */

.center {
    position: absolute;

    left: 50%;
    top: 47%;

    transform: translate(-50%, -50%);

    width: 90%;

    text-align: center;
}

.stage {
    font-size: 13px;
    opacity: .85;
    margin-bottom: 4px;
}

.pot {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
}

/* =========================
   COMMUNITY CARDS
========================= */

.community {
    min-height: 75px;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 6px;
}

/* =========================
   CARDS
========================= */

.card {
    width: 52px;
    height: 70px;

    border-radius: 8px;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #e7e7e7
        );

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    font-weight: bold;

    box-shadow:
        0 4px 8px #0009,
        inset 0 0 0 1px #aaa;

    border: 1px solid #aaa;

    user-select: none;
}

.card.red {
    color: #d71920;
}

.card.black {
    color: #111;
}

.card .rank {
    font-size: 25px;
    line-height: 25px;
}

.card .suit {
    font-size: 22px;
    line-height: 22px;
}

/* =========================
   PLAYER SEATS
========================= */

.seat {
    position: absolute;

    width: 120px;
    min-height: 67px;

    padding: 7px;

    background: #000a;

    border: 1px solid #ffffff30;

    border-radius: 13px;

    text-align: center;

    font-size: 12px;

    backdrop-filter: blur(5px);

    z-index: 4;
}

.seat.active {
    border: 2px solid #ffd83d;

    box-shadow:
        0 0 12px #ffd83d,
        0 0 25px #ffd83d55;
}

.seat-name {
    font-weight: bold;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;

    margin-bottom: 3px;
}

.seat-chips {
    display: flex;
    justify-content: center;
    align-items: center;
}

/* =========================
   GRAPHIC POKER CHIPS
========================= */

.chips {
    display: flex;

    align-items: center;
    justify-content: center;

    min-height: 24px;

    gap: 1px;
}

.chip {
    width: 19px;
    height: 19px;

    border-radius: 50%;

    display: inline-block;

    position: relative;

    border: 2px dashed rgba(255,255,255,.9);

    box-shadow:
        0 2px 3px rgba(0,0,0,.75),
        inset 0 0 0 2px rgba(0,0,0,.18),
        inset 0 0 4px rgba(255,255,255,.25);
}

.chip::after {
    content: "";

    position: absolute;

    width: 7px;
    height: 7px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    border-radius: 50%;

    background: rgba(255,255,255,.22);
}

.chip-red {
    background:
        radial-gradient(
            circle,
            #ef5350,
            #b51218
        );
}

.chip-blue {
    background:
        radial-gradient(
            circle,
            #4c8df5,
            #174a9c
        );
}

.chip-black {
    background:
        radial-gradient(
            circle,
            #555,
            #111
        );
}

.chip-value {
    margin-left: 5px;

    font-size: 11px;

    font-weight: bold;

    color: #ffd95a;
}

/* =========================
   CHIP STACK IN POT
========================= */

.pot-chips {
    height: 25px;

    display: flex;

    justify-content: center;
    align-items: center;

    margin-bottom: 3px;
}

.pot-chip {
    width: 18px;
    height: 18px;

    border-radius: 50%;

    margin-left: -4px;

    border: 2px dashed white;

    box-shadow:
        0 2px 3px #0009,
        inset 0 0 0 2px #0003;
}

.pot-chip:nth-child(1) {
    background: #d62828;
}

.pot-chip:nth-child(2) {
    background: #245fc0;
}

.pot-chip:nth-child(3) {
    background: #222;
}

.pot-chip:nth-child(4) {
    background: #d62828;
}

.pot-chip:nth-child(5) {
    background: #245fc0;
}

/* =========================
   SEAT POSITIONS
========================= */

.s1 {
    left: 50%;
    top: 12px;
    transform: translateX(-50%);
}

.s2 {
    right: 8px;
    top: 105px;
}

.s3 {
    right: 8px;
    bottom: 105px;
}

.s4 {
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
}

.s5 {
    left: 8px;
    bottom: 105px;
}

.s6 {
    left: 8px;
    top: 105px;
}

/* =========================
   TIMER
========================= */

#timerBox {
    position: absolute;

    left: 50%;

    top: calc(50% + 105px);

    transform: translateX(-50%);

    background: #000c;

    border: 1px solid #ffffff35;

    border-radius: 20px;

    padding: 5px 13px;

    font-size: 13px;

    z-index: 10;

    box-shadow: 0 3px 8px #0008;
}

#timer {
    font-weight: bold;
    color: #ffd83d;
}

/* =========================
   MY CARDS
========================= */

.my-area {
    margin-top: 12px;
    text-align: center;
}

.my-title {
    font-size: 13px;
    opacity: .8;
    margin-bottom: 5px;
}

.my-cards {
    display: flex;
    justify-content: center;

    gap: 8px;

    min-height: 75px;
}

/* =========================
   ACTIONS
========================= */

.actions {
    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    gap: 6px;

    margin-top: 10px;
}

.action {
    border: 0;

    border-radius: 9px;

    padding: 11px 4px;

    color: white;

    background: #145d3c;

    font-weight: bold;
}

.action:active {
    transform: scale(.96);
}

.action.raise {
    background: #8b5a08;
}

.action.fold {
    background: #8b2020;
}

.action.allin {
    background: #702080;
}

/* =========================
   MESSAGE
========================= */

.message {
    text-align: center;

    min-height: 22px;

    margin-top: 7px;

    font-size: 13px;

    color: #ffe37b;
}

.waiting {
    text-align: center;

    padding: 15px;

    background: #0006;

    border-radius: 12px;

    margin-top: 10px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .poker-table {
        height: 500px;
        border-width: 9px;
    }

    .seat {
        width: 100px;
        font-size: 11px;
    }

    .card {
        width: 45px;
        height: 63px;
    }

    .card .rank {
        font-size: 22px;
    }

    .card .suit {
        font-size: 19px;
    }

    .actions {
        grid-template-columns:
            repeat(5, 1fr);
    }

    .action {
        font-size: 11px;
        padding: 10px 2px;
    }

    .chip {
        width: 17px;
        height: 17px;
    }

    .chip-value {
        font-size: 10px;
    }
}

</style>
</head>

<body>

<div id="app">

    <!-- TABLE LIST -->

    <div id="tablesPage">

        <h1>♠ Texas Hold'em ♥</h1>

        <div id="status">
            Choose a table
        </div>

        <div id="tables"></div>

    </div>


    <!-- GAME -->

    <div id="game">

        <div class="topbar">

            <button
                class="back"
                onclick="backToTables()">
                ← Tables
            </button>

            <div
                class="table-title"
                id="tableTitle">
                Table
            </div>

        </div>


        <div class="poker-table">

            <!-- SEATS -->

            <div
                class="seat s1"
                id="seat0">
            </div>

            <div
                class="seat s2"
                id="seat1">
            </div>

            <div
                class="seat s3"
                id="seat2">
            </div>

            <div
                class="seat s4"
                id="seat3">
            </div>

            <div
                class="seat s5"
                id="seat4">
            </div>

            <div
                class="seat s6"
                id="seat5">
            </div>


            <!-- CENTER -->

            <div class="center">

                <div
                    class="stage"
                    id="stage">
                    Waiting
                </div>


                <div
                    class="pot-chips"
                    id="potChips">

                    <span class="pot-chip"></span>
                    <span class="pot-chip"></span>
                    <span class="pot-chip"></span>

                </div>


                <div class="pot">

                    Pot:
                    <span id="pot">
                        0
                    </span>

                </div>


                <div
                    class="community"
                    id="community">
                </div>

            </div>


            <!-- TIMER -->

            <div id="timerBox">

                ⏱️
                <span id="timer">
                    20
                </span>
                s

            </div>

        </div>


        <!-- YOUR CARDS -->

        <div class="my-area">

            <div class="my-title">
                Your Cards
            </div>

            <div
                class="my-cards"
                id="myCards">
            </div>

        </div>


        <!-- ACTIONS -->

        <div class="actions">

            <button
                class="action"
                onclick="sendAction('check')">
                Check
            </button>

            <button
                class="action"
                onclick="sendAction('call')">
                Call
            </button>

            <button
                class="action raise"
                onclick="raiseAction()">
                Raise
            </button>

            <button
                class="action allin"
                onclick="sendAction('allin')">
                All-in
            </button>

            <button
                class="action fold"
                onclick="sendAction('fold')">
                Fold
            </button>

        </div>


        <div
            class="message"
            id="message">
        </div>


        <div
            class="waiting"
            id="waiting"
            style="display:none">

            Waiting for the current hand
            to finish...

        </div>

    </div>

</div>


<script>

/* =========================
   TELEGRAM
========================= */

const tg =
    window.Telegram.WebApp;

tg.ready();
tg.expand();


/* =========================
   API
========================= */

const API =
    "https://telegram-poker-backend2.onrender.com";


let myUserId = null;

let myName = "Player";

let selectedTable = null;

let polling = null;

let lastCommunity = "";

let lastCards = "";


/* =========================
   USER
========================= */

function getTelegramUser() {

    const user =
        tg.initDataUnsafe &&
        tg.initDataUnsafe.user;


    if (user) {

        myUserId =
            String(user.id);

        myName =
            user.first_name ||
            user.username ||
            "Player";

    } else {

        let saved =
            localStorage.getItem(
                "test_user_id"
            );


        if (!saved) {

            saved =
                "test_" +
                Math.floor(
                    Math.random() * 1000000
                );

            localStorage.setItem(
                "test_user_id",
                saved
            );
        }


        myUserId = saved;

        myName = "Test Player";
    }
}


getTelegramUser();


/* =========================
   CARD HTML
========================= */

function cardHTML(card) {

    if (!card)
        return "";


    const rank =
        card[0];

    const suit =
        card[1];


    const red =
        suit === "♥" ||
        suit === "♦";


    return `

        <div class="card
            ${red ? "red" : "black"}">

            <div class="rank">
                ${rank}
            </div>

            <div class="suit">
                ${suit}
            </div>

        </div>

    `;
}


/* =========================
   TABLES
========================= */

async function loadTables() {

    try {

        const res =
            await fetch(
                API + "/tables"
            );


        const data =
            await res.json();


        const box =
            document.getElementById(
                "tables"
            );


        box.innerHTML = "";


        data.tables.forEach(
            table => {

                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "table-button";


                button.innerHTML = `

                    🎰 Table
                    ${table.table_id}

                    <br>

                    <small>
                        ${table.players}
                        /
                        ${table.max_players}
                        players
                    </small>

                `;


                button.onclick =
                    () =>
                        joinTable(
                            table.table_id
                        );


                box.appendChild(
                    button
                );

            }
        );


    } catch (e) {

        document.getElementById(
            "status"
        ).innerText =
            "Connection error";

    }
}


/* =========================
   JOIN
========================= */

async function joinTable(tableId) {

    selectedTable =
        tableId;


    document.getElementById(
        "status"
    ).innerText =
        "Joining table...";


    try {

        const res =
            await fetch(
                API + "/join",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            user_id:
                                myUserId,

                            name:
                                myName,

                            table_id:
                                tableId

                        })
                }
            );


        const data =
            await res.json();


        if (!res.ok) {

            alert(
                data.detail ||
                "Cannot join table"
            );

            return;
        }


        document.getElementById(
            "tablesPage"
        ).style.display =
            "none";


        document.getElementById(
            "game"
        ).style.display =
            "block";


        document.getElementById(
            "tableTitle"
        ).innerText =
            "Table " +
            tableId;


        startPolling();


    } catch (e) {

        alert(
            "Cannot connect to server"
        );

    }
}


/* =========================
   POLLING
========================= */

function startPolling() {

    if (polling)
        clearInterval(polling);


    loadGame();


    polling =
        setInterval(
            loadGame,
            500
        );
}


/* =========================
   LOAD GAME
========================= */

async function loadGame() {

    if (!selectedTable)
        return;


    try {

        const res =
            await fetch(

                API +
                "/game?table_id=" +
                selectedTable +
                "&user_id=" +
                encodeURIComponent(
                    myUserId
                )

            );


        const data =
            await res.json();


        if (!data.success)
            return;


        renderGame(data);


    } catch (e) {

        document.getElementById(
            "message"
        ).innerText =
            "Connection lost...";

    }
}


/* =========================
   RENDER GAME
========================= */

function renderGame(data) {

    document.getElementById(
        "stage"
    ).innerText =
        String(
            data.stage
        ).toUpperCase();


    document.getElementById(
        "pot"
    ).innerText =
        data.pot || 0;


    /* COMMUNITY */

    const communityKey =
        JSON.stringify(
            data.community_cards || []
        );


    if (
        communityKey !==
        lastCommunity
    ) {

        document.getElementById(
            "community"
        ).innerHTML =

            (
                data.community_cards ||
                []
            )
            .map(cardHTML)
            .join("");


        lastCommunity =
            communityKey;
    }


    /* YOUR CARDS */

    const cardsKey =
        JSON.stringify(
            data.my_cards || []
        );


    if (
        cardsKey !==
        lastCards
    ) {

        document.getElementById(
            "myCards"
        ).innerHTML =

            (
                data.my_cards ||
                []
            )
            .map(cardHTML)
            .join("");


        lastCards =
            cardsKey;
    }


    /* PLAYERS */

    renderPlayers(
        data.players || []
    );


    /* MESSAGE */

    document.getElementById(
        "message"
    ).innerText =
        data.message || "";


    /* WAITING */

    const waiting =
        data.waiting &&
        data.waiting.some(
            p =>
                String(
                    p.user_id
                ) ===
                String(
                    myUserId
                )
        );


    document.getElementById(
        "waiting"
    ).style.display =
        waiting
            ? "block"
            : "none";


    /* TIMER */

    updateTimer(data);
}


/* =========================
   PLAYERS
========================= */

function renderPlayers(players) {

    for (
        let i = 0;
        i < 6;
        i++
    ) {

        const seat =
            document.getElementById(
                "seat" + i
            );


        seat.innerHTML = "";


        seat.classList.remove(
            "active"
        );


        seat.style.opacity =
            "1";
    }


    players.forEach(
        (player, index) => {

            if (index >= 6)
                return;


            const seat =
                document.getElementById(
                    "seat" + index
                );


            seat.innerHTML = `

                <div class="seat-name">

                    ${escapeHTML(
                        player.name
                    )}

                </div>


                <div class="chips">

                    <span
                        class="chip chip-red">
                    </span>

                    <span
                        class="chip chip-blue">
                    </span>

                    <span
                        class="chip chip-black">
                    </span>

                    <span
                        class="chip-value">

                        ${player.chips}

                    </span>

                </div>


                <div class="seat-bet">

                    Bet:
                    ${player.bet}

                </div>

            `;


            if (player.is_turn) {

                seat.classList.add(
                    "active"
                );

            }


            if (player.folded) {

                seat.style.opacity =
                    ".4";

            }

        }
    );
}


/* =========================
   TIMER
========================= */

function updateTimer(data) {

    const timer =
        document.getElementById(
            "timer"
        );


    if (
        data.started &&
        data.current_player
    ) {

        const seconds =
            Number(
                data.timer || 0
            );


        timer.innerText =
            Math.max(
                0,
                seconds
            );


        if (
            String(
                data.current_player
            ) ===
            String(
                myUserId
            )
        ) {

            timer.style.color =
                "#ffdf38";

        } else {

            timer.style.color =
                "#ffffff";
        }


    } else {

        timer.innerText =
            "—";

    }
}


/* =========================
   ACTION
========================= */

async function sendAction(
    action
) {

    if (!selectedTable)
        return;


    try {

        await fetch(
            API + "/action",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({

                        user_id:
                            myUserId,

                        action:
                            action,

                        amount:
                            0,

                        table_id:
                            selectedTable

                    })

            }
        );


        loadGame();


    } catch (e) {

        console.log(e);

    }
}


/* =========================
   RAISE
========================= */

function raiseAction() {

    const amount =
        prompt(
            "Raise amount:",
            "40"
        );


    if (
        amount === null ||
        amount === ""
    )
        return;


    sendRaise(
        Number(amount)
    );
}


async function sendRaise(
    amount
) {

    try {

        await fetch(
            API + "/action",
            {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({

                        user_id:
                            myUserId,

                        action:
                            "raise",

                        amount:
                            amount,

                        table_id:
                            selectedTable

                    })

            }
        );


        loadGame();


    } catch (e) {

        console.log(e);

    }
}


/* =========================
   BACK
========================= */

async function backToTables() {

    if (selectedTable) {

        try {

            await fetch(
                API + "/leave",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            user_id:
                                myUserId,

                            name:
                                myName,

                            table_id:
                                selectedTable

                        })

                }
            );

        } catch (e) {}

    }


    if (polling)
        clearInterval(
            polling
        );


    selectedTable =
        null;


    lastCommunity =
        "";


    lastCards =
        "";


    document.getElementById(
        "game"
    ).style.display =
        "none";


    document.getElementById(
        "tablesPage"
    ).style.display =
        "block";


    loadTables();
}


/* =========================
   SECURITY
========================= */

function escapeHTML(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
