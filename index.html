<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
/>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<title>Texas Hold'em</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:
        radial-gradient(circle at top,#163d32,#07130f 65%);
    color:white;
    font-family:Arial,sans-serif;
    min-height:100vh;
    overflow-x:hidden;
}

button{
    border:0;
    cursor:pointer;
    font-weight:bold;
}

#app{
    max-width:900px;
    margin:auto;
    padding:14px;
}

/* ================= TABLE SELECT ================= */

#tablesScreen h1{
    text-align:center;
    margin:10px 0 20px;
}

.tables{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.tableButton{
    background:
        linear-gradient(145deg,#174f3e,#0d2b23);
    border:1px solid rgba(255,255,255,.12);
    border-radius:18px;
    padding:20px 12px;
    color:white;
    box-shadow:0 8px 25px #0007;
}

.tableButton:active{
    transform:scale(.97);
}

.tableNumber{
    font-size:23px;
    font-weight:bold;
}

.tableInfo{
    margin-top:8px;
    opacity:.75;
    font-size:13px;
}

/* ================= GAME ================= */

#gameScreen{
    display:none;
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
}

.back{
    background:#ffffff18;
    color:white;
    padding:9px 14px;
    border-radius:10px;
}

.status{
    font-size:13px;
    opacity:.8;
}

.tableWrap{
    position:relative;
    height:600px;
}

.pokerTable{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(92vw,620px);
    height:min(65vw,390px);
    min-height:310px;

    background:
        radial-gradient(ellipse,#16704e,#0b422f 70%);

    border:
        12px solid #452b19;

    border-radius:50%;

    box-shadow:
        0 0 0 3px #8a5a32,
        0 20px 50px #000b;
}

/* ================= COMMUNITY ================= */

.community{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);

    display:flex;
    gap:5px;

    z-index:20;
}

.card{
    width:46px;
    height:66px;

    background:#fff;
    color:#111;

    border-radius:7px;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:21px;
    font-weight:bold;

    box-shadow:0 3px 8px #0008;
}

.red{
    color:#d71920;
}

/* ================= SEATS ================= */

.seat{
    position:absolute;
    width:110px;
    min-height:55px;

    transform:translate(-50%,-50%);

    background:#101b18e8;
    border:1px solid #ffffff20;

    border-radius:13px;

    padding:6px;

    text-align:center;

    z-index:30;
}

.seat.me{
    border:2px solid #ffd34d;
}

.seat.turn{
    box-shadow:
        0 0 0 3px #ffd34d55,
        0 0 20px #ffd34d;
}

.seatName{
    font-size:13px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
}

.seatChips{
    font-size:11px;
    opacity:.8;
    margin-top:3px;
}

.seatBet{
    font-size:10px;
    color:#ffd34d;
}

.seatCards{
    margin-top:3px;
}

/* positions */

.s1{left:50%;top:3%}
.s2{left:90%;top:25%}
.s3{left:90%;top:76%}
.s4{left:50%;top:97%}
.s5{left:10%;top:76%}
.s6{left:10%;top:25%}

/* ================= POT ================= */

.pot{
    position:absolute;
    left:50%;
    top:32%;

    transform:translate(-50%,-50%);

    z-index:25;

    background:#0007;
    padding:5px 13px;

    border-radius:20px;

    font-size:13px;
}

/* ================= INFO ================= */

.stage{
    position:absolute;

    left:50%;
    top:69%;

    transform:translateX(-50%);

    z-index:25;

    font-size:12px;
    opacity:.75;

    white-space:nowrap;
}

.message{
    text-align:center;
    min-height:22px;
    margin:5px;
    font-size:13px;
}

/* ================= PLAYER CARDS ================= */

.myCards{
    display:flex;
    justify-content:center;
    gap:8px;
    margin:5px 0 10px;
}

.myCards .card{
    width:62px;
    height:86px;
    font-size:27px;
}

/* ================= ACTIONS ================= */

.actions{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    max-width:600px;
    margin:auto;
}

.actions button{
    padding:13px 5px;
    border-radius:10px;
    color:white;
    background:#174c3c;
}

.actions button:disabled{
    opacity:.35;
}

.raiseRow{
    display:flex;
    gap:7px;
    max-width:600px;
    margin:7px auto;
}

.raiseRow input{
    flex:1;
    min-width:0;
    background:#10251e;
    border:1px solid #ffffff20;
    border-radius:10px;
    color:white;
    padding:12px;
}

.raiseRow button{
    background:#b88620;
    color:white;
    border-radius:10px;
    padding:0 18px;
}

/* ================= WAITING ================= */

.waitingBox{
    display:none;
    text-align:center;
    background:#ffffff10;
    border:1px solid #ffffff15;
    border-radius:13px;
    padding:13px;
    margin:8px 0;
}

.small{
    font-size:12px;
    opacity:.7;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

    .tableWrap{
        height:480px;
    }

    .pokerTable{
        height:290px;
        min-height:0;
        border-width:8px;
    }

    .seat{
        width:91px;
        min-height:49px;
    }

    .card{
        width:38px;
        height:55px;
        font-size:17px;
    }

    .myCards .card{
        width:57px;
        height:78px;
        font-size:24px;
    }

    .community{
        gap:3px;
    }

    .pot{
        top:34%;
    }

    .stage{
        top:68%;
    }

    .actions{
        grid-template-columns:repeat(2,1fr);
    }
}

</style>
</head>

<body>

<div id="app">

    <!-- ================= TABLES ================= -->

    <section id="tablesScreen">

        <h1>♠ Texas Hold'em</h1>

        <div class="small" style="text-align:center;margin-bottom:15px">
            Choose a table
        </div>

        <div id="tables" class="tables"></div>

    </section>


    <!-- ================= GAME ================= -->

    <section id="gameScreen">

        <div class="topbar">

            <button class="back" onclick="backToTables()">
                ← Tables
            </button>

            <div id="tableTitle">
                Table
            </div>

            <div class="status" id="connection">
                Connecting...
            </div>

        </div>


        <div class="waitingBox" id="waitingBox">
            ⏳ You are waiting for the next hand.
            <div class="small">
                The current hand must finish first.
            </div>
        </div>


        <div class="tableWrap">

            <div class="pokerTable">

                <div class="pot" id="pot">
                    Pot: 0
                </div>

                <div class="community" id="community"></div>

                <div class="stage" id="stage">
                    Waiting
                </div>

                <div id="seats"></div>

            </div>

        </div>


        <div class="message" id="message"></div>


        <div class="myCards" id="myCards"></div>


        <div class="actions">

            <button id="checkBtn"
                onclick="action('check')">
                Check
            </button>

            <button id="callBtn"
                onclick="action('call')">
                Call
            </button>

            <button id="foldBtn"
                onclick="action('fold')">
                Fold
            </button>

            <button id="allinBtn"
                onclick="action('allin')">
                All-in
            </button>

        </div>


        <div class="raiseRow">

            <input
                id="raiseAmount"
                type="number"
                placeholder="Raise amount"
            >

            <button onclick="raise()">
                Raise
            </button>

        </div>

    </section>

</div>


<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const API =
    "https://telegram-poker-backend2.onrender.com";

let userId = null;
let userName = "Player";

let tableId = null;

let game = null;

let pollTimer = null;


/* ======================================================
   USER
====================================================== */

function getUser(){

    const user =
        tg.initDataUnsafe &&
        tg.initDataUnsafe.user;

    if(user){

        userId =
            String(user.id);

        userName =
            user.first_name ||
            user.username ||
            "Player";

    }else{

        let saved =
            localStorage.getItem(
                "poker_test_id"
            );

        if(!saved){

            saved =
                "test_" +
                Math.random()
                    .toString(36)
                    .substring(2,10);

            localStorage.setItem(
                "poker_test_id",
                saved
            );
        }

        userId = saved;
        userName = "Player";
    }
}


/* ======================================================
   API
====================================================== */

async function api(url, options={}){

    const response =
        await fetch(API + url, {
            ...options,
            headers:{
                "Content-Type":
                    "application/json"
            }
        });

    const data =
        await response.json();

    if(!response.ok){

        throw new Error(
            data.detail ||
            "Server error"
        );
    }

    return data;
}


/* ======================================================
   TABLE LIST
====================================================== */

async function loadTables(){

    try{

        const data =
            await api("/tables");

        const box =
            document.getElementById(
                "tables"
            );

        box.innerHTML = "";

        data.tables.forEach(t => {

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "tableButton";

            const state =
                t.started
                    ? "Game in progress"
                    : "Waiting for players";

            button.innerHTML = `
                <div class="tableNumber">
                    Table ${t.table_id}
                </div>

                <div class="tableInfo">
                    ${t.players}/${t.max_players}
                    players
                    <br>
                    ${state}
                </div>
            `;

            button.onclick =
                () => joinTable(t.table_id);

            box.appendChild(button);

        });

    }catch(e){

        document.getElementById(
            "tables"
        ).innerHTML =
            "<div>Connection error</div>";
    }
}


/* ======================================================
   JOIN
====================================================== */

async function joinTable(id){

    tableId = id;

    try{

        const result =
            await api("/join",{
                method:"POST",

                body:JSON.stringify({
                    user_id:userId,
                    name:userName,
                    table_id:id
                })
            });

        document.getElementById(
            "tablesScreen"
        ).style.display="none";

        document.getElementById(
            "gameScreen"
        ).style.display="block";

        document.getElementById(
            "tableTitle"
        ).innerText =
            "Table " + id;

        startPolling();

        await loadGame();

    }catch(e){

        alert(e.message);

        loadTables();
    }
}


/* ======================================================
   POLLING
====================================================== */

function startPolling(){

    stopPolling();

    loadGame();

    pollTimer =
        setInterval(
            loadGame,
            700
        );
}


function stopPolling(){

    if(pollTimer){

        clearInterval(
            pollTimer
        );

        pollTimer=null;
    }
}


/* ======================================================
   GAME
====================================================== */

async function loadGame(){

    if(!tableId)
        return;

    try{

        const data =
            await api(
                `/game?table_id=${tableId}&user_id=${encodeURIComponent(userId)}`
            );

        game = data;

        document.getElementById(
            "connection"
        ).innerText =
            "● Connected";

        renderGame();

    }catch(e){

        document.getElementById(
            "connection"
        ).innerText =
            "Connecting...";
    }
}


/* ======================================================
   RENDER
====================================================== */

function renderGame(){

    if(!game)
        return;


    document.getElementById(
        "pot"
    ).innerText =
        "Pot: " + game.pot;


    document.getElementById(
        "stage"
    ).innerText =
        stageName(game.stage);


    document.getElementById(
        "message"
    ).innerText =
        game.last_action ||
        game.message ||
        "";


    renderCommunity();

    renderSeats();

    renderMyCards();

    updateWaiting();

    updateButtons();
}


/* ======================================================
   COMMUNITY CARDS
====================================================== */

function renderCommunity(){

    const box =
        document.getElementById(
            "community"
        );

    box.innerHTML = "";

    /*
       IMPORTANT:
       Backend sends exactly:

       flop  = 3 cards
       turn  = 4 cards
       river = 5 cards

       No card is artificially added
       by frontend.
    */

    game.community_cards
        .forEach(card => {

            const el =
                createCard(card);

            box.appendChild(el);

        });
}


/* ======================================================
   SEATS
====================================================== */

function renderSeats(){

    const box =
        document.getElementById(
            "seats"
        );

    box.innerHTML = "";

    game.players.forEach(
        (p,index) => {

            const seat =
                document.createElement(
                    "div"
                );

            seat.className =
                "seat s" +
                (index + 1);

            if(p.is_me)
                seat.classList.add("me");

            if(p.is_turn)
                seat.classList.add("turn");

            let status = "";

            if(p.folded)
                status = "Folded";

            else if(p.all_in)
                status = "ALL-IN";

            seat.innerHTML = `
                <div class="seatName">
                    ${escapeHtml(p.name)}
                </div>

                <div class="seatChips">
                    ${p.chips} chips
                </div>

                ${
                    p.bet > 0
                    ? `<div class="seatBet">
                        Bet ${p.bet}
                       </div>`
                    : ""
                }

                ${
                    status
                    ? `<div class="seatBet">
                        ${status}
                       </div>`
                    : ""
                }
            `;

            box.appendChild(seat);
        }
    );
}


/* ======================================================
   MY CARDS
====================================================== */

function renderMyCards(){

    const box =
        document.getElementById(
            "myCards"
        );

    box.innerHTML = "";

    if(!game.my_cards)
        return;

    game.my_cards.forEach(
        card => {

            box.appendChild(
                createCard(card)
            );

        }
    );
}


/* ======================================================
   CARD
====================================================== */

function createCard(card){

    const el =
        document.createElement(
            "div"
        );

    el.className =
        "card";

    if(
        card.includes("♥") ||
        card.includes("♦")
    ){
        el.classList.add("red");
    }

    el.innerText = card;

    return el;
}


/* ======================================================
   BUTTONS
====================================================== */

function updateButtons(){

    const me =
        game.players.find(
            p => p.is_me
        );

    const myTurn =
        !!(
            me &&
            game.started &&
            game.current_player ===
                me.user_id &&
            !me.folded &&
            !me.all_in
        );

    document.getElementById(
        "checkBtn"
    ).disabled = !myTurn;

    document.getElementById(
        "callBtn"
    ).disabled = !myTurn;

    document.getElementById(
        "foldBtn"
    ).disabled = !myTurn;

    document.getElementById(
        "allinBtn"
    ).disabled = !myTurn;
}


/* ======================================================
   WAITING
====================================================== */

function updateWaiting(){

    const box =
        document.getElementById(
            "waitingBox"
        );

    box.style.display =
        game.waiting
            ? "block"
            : "none";
}


/* ======================================================
   ACTION
====================================================== */

async function action(type){

    if(!game)
        return;

    try{

        await api(
            "/action",
            {
                method:"POST",

                body:JSON.stringify({

                    user_id:userId,

                    table_id:tableId,

                    action:type,

                    amount:0

                })
            }
        );

        await loadGame();

    }catch(e){

        alert(e.message);
    }
}


/* ======================================================
   RAISE
====================================================== */

async function raise(){

    const input =
        document.getElementById(
            "raiseAmount"
        );

    const amount =
        Number(input.value);

    if(!amount)
        return;

    try{

        await api(
            "/action",
            {
                method:"POST",

                body:JSON.stringify({

                    user_id:userId,

                    table_id:tableId,

                    action:"raise",

                    amount:amount

                })
            }
        );

        input.value="";

        await loadGame();

    }catch(e){

        alert(e.message);
    }
}


/* ======================================================
   BACK
====================================================== */

async function backToTables(){

    stopPolling();

    try{

        await api(
            `/leave?user_id=${encodeURIComponent(userId)}&table_id=${tableId}`,
            {
                method:"POST"
            }
        );

    }catch(e){}

    tableId=null;

    document.getElementById(
        "gameScreen"
    ).style.display="none";

    document.getElementById(
        "tablesScreen"
    ).style.display="block";

    loadTables();
}


/* ======================================================
   HELPERS
====================================================== */

function stageName(stage){

    const names = {

        waiting:"Waiting",

        preflop:"Pre-Flop",

        flop:"Flop",

        turn:"Turn",

        river:"River"

    };

    return names[stage] ||
        stage;
}


function escapeHtml(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* ======================================================
   START
====================================================== */

getUser();

loadTables();

</script>

</body>
</html>
