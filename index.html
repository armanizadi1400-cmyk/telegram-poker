<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Telegram Poker</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    overflow: hidden;
    background: #060907;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

button {
    font-family: inherit;
}

#app {
    width: 100%;
    height: 100vh;
    position: relative;
    overflow: hidden;
    background:
        radial-gradient(circle at 50% 35%, #173b29 0%, #0b1710 48%, #050705 100%);
}

/* ================= HEADER ================= */

.header {
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    background: rgba(0,0,0,.42);
    border-bottom: 1px solid rgba(255,255,255,.08);
    position: relative;
    z-index: 50;
    backdrop-filter: blur(12px);
}

.logo {
    font-size: 19px;
    font-weight: 900;
    letter-spacing: .2px;
}

.logo span {
    background: linear-gradient(135deg,#fff,#7eeaa4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.status-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
}

.status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ff5858;
    box-shadow: 0 0 8px rgba(255,88,88,.7);
}

.status-dot.online {
    background: #55ed82;
    box-shadow: 0 0 9px rgba(85,237,130,.8);
}

.status {
    font-size: 11px;
    color: #9ca9a1;
}

/* ================= TABLE AREA ================= */

.table-area {
    height: calc(100vh - 205px);
    min-height: 410px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* ================= TABLE ================= */

.table {
    width: 91%;
    max-width: 650px;
    aspect-ratio: 1.62;
    position: relative;

    background:
        radial-gradient(circle at 50% 45%, #199456 0%, #0c7040 48%, #064528 100%);

    border: 13px solid #4a2b19;
    border-radius: 50%;

    box-shadow:
        inset 0 0 0 2px rgba(255,255,255,.08),
        inset 0 0 45px rgba(0,0,0,.48),
        0 20px 45px rgba(0,0,0,.65),
        0 0 0 5px rgba(255,255,255,.025);

    overflow: visible;
}

.table::before {
    content: "";
    position: absolute;
    inset: 9px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 50%;
    pointer-events: none;
}

.table::after {
    content: "";
    position: absolute;
    width: 45%;
    height: 18%;
    left: 27.5%;
    top: 41%;
    border-radius: 50%;
    background: rgba(0,0,0,.08);
    filter: blur(12px);
    pointer-events: none;
}

/* ================= CENTER ================= */

.center {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    text-align: center;
    z-index: 5;
    width: 58%;
}

.pot-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: rgba(255,255,255,.62);
}

.pot {
    margin-top: 2px;
    font-size: 21px;
    font-weight: 900;
    text-shadow: 0 2px 5px rgba(0,0,0,.35);
}

.stage {
    display: inline-block;
    margin-top: 5px;
    padding: 3px 9px;
    border-radius: 20px;
    background: rgba(0,0,0,.22);
    color: rgba(255,255,255,.75);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
}

.community {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 5px;
    margin-top: 8px;
    min-height: 48px;
}

/* ================= CARDS ================= */

.card {
    width: 40px;
    height: 56px;
    border-radius: 6px;
    background: linear-gradient(145deg,#fff,#e8e8e8);
    color: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 19px;
    font-weight: 900;
    box-shadow:
        0 4px 9px rgba(0,0,0,.4),
        inset 0 0 0 1px rgba(0,0,0,.08);
    animation: cardIn .25s ease-out;
}

.card.red {
    color: #d91e35;
}

.card.back {
    background:
        linear-gradient(135deg,#122755,#2857a5);
    border: 2px solid rgba(255,255,255,.9);
    color: #fff;
    font-size: 17px;
    box-shadow:
        0 3px 8px rgba(0,0,0,.45),
        inset 0 0 0 2px rgba(255,255,255,.08);
}

@keyframes cardIn {
    from {
        opacity: 0;
        transform: translateY(-8px) scale(.85);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* ================= PLAYERS ================= */

.player {
    position: absolute;
    width: 108px;
    text-align: center;
    transform: translate(-50%,-50%);
    z-index: 20;
}

.player-box {
    position: relative;
    min-width: 82px;
    background: rgba(5,10,7,.78);
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 13px;
    padding: 6px 7px;
    backdrop-filter: blur(7px);
    box-shadow: 0 5px 15px rgba(0,0,0,.35);
    transition: .2s ease;
}

.player.turn .player-box {
    border: 2px solid #ffd63d;
    box-shadow:
        0 0 12px rgba(255,214,61,.55),
        0 0 25px rgba(255,214,61,.18);
    animation: turnPulse 1s infinite alternate;
}

@keyframes turnPulse {
    from { transform: scale(1); }
    to { transform: scale(1.035); }
}

.player.me .player-box {
    border-color: #3ca8ff;
    box-shadow: 0 0 13px rgba(60,168,255,.22);
}

.player.folded {
    opacity: .42;
}

.player-name {
    font-size: 11px;
    font-weight: 900;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 95px;
    margin: auto;
}

.player-chips {
    font-size: 9px;
    color: #cbd7cf;
    margin-top: 3px;
}

.player-cards {
    display: flex;
    justify-content: center;
    margin-top: 4px;
    height: 30px;
}

.player-cards .card {
    width: 23px;
    height: 32px;
    font-size: 11px;
}

.player-cards .card + .card {
    margin-left: -8px;
}

/* BOT BADGE */

.bot-badge {
    display: inline-block;
    margin-left: 3px;
    font-size: 10px;
}

/* ================= TIMER ================= */

.turn-timer {
    position: absolute;
    left: 50%;
    bottom: -18px;
    transform: translateX(-50%);
    min-width: 30px;
    height: 30px;
    border-radius: 50%;
    display: none;
    align-items: center;
    justify-content: center;
    background: #171b18;
    border: 2px solid #ffd63d;
    color: #ffd63d;
    font-size: 11px;
    font-weight: 900;
    box-shadow: 0 0 12px rgba(255,214,61,.45);
    z-index: 30;
}

.player.turn .turn-timer {
    display: flex;
}

.turn-timer.danger {
    border-color: #ff4e4e;
    color: #ff5b5b;
    box-shadow: 0 0 14px rgba(255,70,70,.65);
    animation: dangerPulse .45s infinite alternate;
}

@keyframes dangerPulse {
    from { transform: translateX(-50%) scale(1); }
    to { transform: translateX(-50%) scale(1.12); }
}

/* ================= SEATS ================= */

.seat0 {
    left: 50%;
    bottom: -17px;
}

.seat1 {
    left: 9%;
    bottom: 10%;
}

.seat2 {
    left: 4%;
    top: 20%;
}

.seat3 {
    left: 50%;
    top: -17px;
}

.seat4 {
    right: -5%;
    top: 20%;
}

.seat5 {
    right: 0%;
    bottom: 10%;
}

/* ================= MY CARDS ================= */

.my-cards-area {
    position: absolute;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    text-align: center;
    z-index: 25;
}

.my-title {
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: rgba(255,255,255,.55);
    margin-bottom: 5px;
}

.my-cards {
    display: flex;
    justify-content: center;
    gap: 6px;
}

.my-cards .card {
    width: 38px;
    height: 53px;
}

/* ================= CONTROLS ================= */

.controls {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    min-height: 147px;
    padding: 9px 11px 13px;
    background: rgba(5,8,6,.97);
    border-top: 1px solid rgba(255,255,255,.09);
    z-index: 100;
    backdrop-filter: blur(12px);
}

.actions {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 7px;
}

button {
    border: 0;
    border-radius: 11px;
    padding: 12px 4px;
    color: white;
    font-size: 12px;
    font-weight: 900;
    cursor: pointer;
    transition: transform .12s, filter .12s, opacity .12s;
}

button:active {
    transform: scale(.95);
}

button:disabled {
    opacity: .28;
    filter: grayscale(.5);
}

.btn-fold {
    background: linear-gradient(135deg,#71363b,#49272b);
}

.btn-check {
    background: linear-gradient(135deg,#2c9658,#17633a);
}

.btn-call {
    background: linear-gradient(135deg,#337fbe,#225680);
}

.btn-raise {
    background: linear-gradient(135deg,#bd851c,#79540d);
}

.btn-allin {
    background: linear-gradient(135deg,#c63d45,#79262c);
}

.bottom-row {
    display: flex;
    justify-content: center;
    gap: 7px;
    margin-top: 8px;
}

.small-btn {
    padding: 7px 13px;
    font-size: 10px;
    background: #202722;
    color: #bdc8c0;
}

/* ================= START SCREEN ================= */

.start-screen {
    position: fixed;
    inset: 0;
    z-index: 200;
    background:
        radial-gradient(circle at 50% 35%,#184b30 0%,#09120c 48%,#040604 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 25px;
    text-align: center;
}

.start-screen.hidden {
    display: none;
}

.start-logo {
    font-size: 43px;
    letter-spacing: 5px;
    text-shadow: 0 5px 20px rgba(0,0,0,.5);
}

.start-title {
    margin-top: 9px;
    font-size: 29px;
    font-weight: 900;
}

.start-sub {
    margin-top: 7px;
    color: #a9b7ae;
    font-size: 12px;
}

.start-info {
    display: flex;
    gap: 8px;
    margin-top: 18px;
}

.info-chip {
    padding: 7px 10px;
    border-radius: 20px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.08);
    font-size: 10px;
    color: #c5d0c8;
}

.start-button {
    margin-top: 25px;
    width: 230px;
    background: linear-gradient(135deg,#1bb567,#087640);
    font-size: 17px;
    padding: 16px;
    box-shadow: 0 10px 28px rgba(0,0,0,.4);
}

/* ================= LOADING ================= */

.loading {
    position: fixed;
    inset: 0;
    z-index: 500;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.62);
    backdrop-filter: blur(3px);
    font-size: 14px;
}

.loading.show {
    display: flex;
}

.loader {
    width: 30px;
    height: 30px;
    border: 3px solid rgba(255,255,255,.2);
    border-top-color: #55e985;
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin-right: 10px;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* ================= TOAST ================= */

.toast {
    position: fixed;
    top: 68px;
    left: 50%;
    transform: translateX(-50%) translateY(-10px);
    background: rgba(0,0,0,.88);
    border: 1px solid rgba(255,255,255,.1);
    padding: 9px 15px;
    border-radius: 12px;
    font-size: 11px;
    opacity: 0;
    pointer-events: none;
    transition: .2s;
    z-index: 600;
    white-space: nowrap;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* ================= MOBILE ================= */

@media(max-width:430px) {

    .table-area {
        height: calc(100vh - 205px);
        min-height: 385px;
    }

    .table {
        width: 94%;
        border-width: 10px;
    }

    .player {
        width: 88px;
    }

    .player-name {
        font-size: 10px;
    }

    .player-chips {
        font-size: 8px;
    }

    .card {
        width: 34px;
        height: 48px;
        font-size: 16px;
    }

    .community {
        gap: 3px;
    }

    .community .card {
        width: 32px;
        height: 45px;
        font-size: 15px;
    }

    .pot {
        font-size: 17px;
    }

    .center {
        width: 62%;
    }

    .my-cards-area {
        bottom: 8px;
    }

    .my-cards .card {
        width: 34px;
        height: 48px;
    }

    .controls {
        min-height: 145px;
    }
}

@media(max-height:700px) {

    .table-area {
        min-height: 350px;
    }

    .my-cards-area {
        bottom: 4px;
    }

    .controls {
        min-height: 137px;
    }

    button {
        padding: 10px 4px;
    }
}
</style>
</head>

<body>

<div id="app">

    <div class="header">
        <div class="logo">♠ <span>Telegram Poker</span></div>

        <div class="status-wrap">
            <div id="statusDot" class="status-dot"></div>
            <div id="status" class="status">Connecting...</div>
        </div>
    </div>

    <div class="table-area">

        <div class="table">

            <div id="seat0" class="player seat0"></div>
            <div id="seat1" class="player seat1"></div>
            <div id="seat2" class="player seat2"></div>
            <div id="seat3" class="player seat3"></div>
            <div id="seat4" class="player seat4"></div>
            <div id="seat5" class="player seat5"></div>

            <div class="center">

                <div class="pot-label">CURRENT POT</div>

                <div class="pot">
                    🪙 <span id="pot">0</span>
                </div>

                <div id="stage" class="stage">
                    WAITING
                </div>

                <div id="community" class="community"></div>

            </div>

        </div>

        <div class="my-cards-area">

            <div class="my-title">
                YOUR CARDS
            </div>

            <div id="myCards" class="my-cards"></div>

        </div>

    </div>

    <div class="controls">

        <div class="actions">

            <button id="foldBtn"
                    class="btn-fold"
                    onclick="doAction('fold')">
                FOLD
            </button>

            <button id="checkBtn"
                    class="btn-check"
                    onclick="doAction('check')">
                CHECK
            </button>

            <button id="callBtn"
                    class="btn-call"
                    onclick="doAction('call')">
                CALL
            </button>

            <button id="raiseBtn"
                    class="btn-raise"
                    onclick="raiseAction()">
                RAISE
            </button>

        </div>

        <div class="bottom-row">

            <button id="allinBtn"
                    class="small-btn"
                    onclick="doAction('allin')">
                ALL-IN
            </button>

            <button class="small-btn"
                    onclick="refreshGame()">
                REFRESH
            </button>

            <button class="small-btn"
                    onclick="startGame()">
                START
            </button>

        </div>

    </div>

</div>


<!-- ================= START SCREEN ================= -->

<div id="startScreen" class="start-screen">

    <div class="start-logo">
        ♠ ♥ ♦ ♣
    </div>

    <div class="start-title">
        Telegram Poker
    </div>

    <div class="start-sub">
        Texas Hold'em · Play against real players & bots
    </div>

    <div class="start-info">

        <div class="info-chip">
            👥 6 Players
        </div>

        <div class="info-chip">
            ⏱ 25 sec
        </div>

        <div class="info-chip">
            🪙 1000 Chips
        </div>

    </div>

    <button class="start-button"
            onclick="startGame()">
        START GAME
    </button>

</div>


<!-- ================= LOADING ================= -->

<div id="loading" class="loading">

    <div class="loader"></div>

    <div>
        Connecting...
    </div>

</div>


<div id="toast" class="toast"></div>


<script>

/* =========================================================
   TELEGRAM
========================================================= */

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();


/* =========================================================
   BACKEND
========================================================= */

const API =
    "https://telegram-poker-backend2.onrender.com";


/* =========================================================
   VARIABLES
========================================================= */

let userId = null;
let userName = "Player";

let gameState = null;

let pollTimer = null;
let timerTimer = null;

const TURN_SECONDS = 25;


/* =========================================================
   TELEGRAM USER
========================================================= */

function getTelegramUser() {

    const user =
        tg.initDataUnsafe &&
        tg.initDataUnsafe.user;

    if (user) {

        userId =
            String(user.id);

        userName =
            user.first_name ||
            user.username ||
            "Player";

        return;
    }

    /* Browser fallback */

    let saved =
        localStorage.getItem(
            "poker_test_user"
        );

    if (!saved) {

        saved =
            "test_" +
            Math.floor(
                Math.random() * 1000000
            );

        localStorage.setItem(
            "poker_test_user",
            saved
        );
    }

    userId = saved;

    userName = "Test Player";
}


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    text,
    online = false
) {

    const status =
        document.getElementById(
            "status"
        );

    const dot =
        document.getElementById(
            "statusDot"
        );

    status.innerText = text;

    if (online) {

        dot.classList.add(
            "online"
        );

        status.style.color =
            "#8cff9c";

    } else {

        dot.classList.remove(
            "online"
        );

        status.style.color =
            "#ff7777";
    }
}


/* =========================================================
   TOAST
========================================================= */

function showToast(message) {

    const toast =
        document.getElementById(
            "toast"
        );

    toast.innerText =
        message;

    toast.classList.add(
        "show"
    );

    setTimeout(() => {

        toast.classList.remove(
            "show"
        );

    }, 2200);
}


/* =========================================================
   LOADING
========================================================= */

function setLoading(show) {

    const loading =
        document.getElementById(
            "loading"
        );

    if (show)
        loading.classList.add(
            "show"
        );
    else
        loading.classList.remove(
            "show"
        );
}


/* =========================================================
   API
========================================================= */

async function api(
    path,
    options = {}
) {

    const response =
        await fetch(
            API + path,
            {
                ...options,

                headers: {
                    "Content-Type":
                        "application/json",

                    ...(options.headers || {})
                }
            }
        );

    let data;

    try {

        data =
            await response.json();

    } catch {

        throw new Error(
            "Invalid server response"
        );
    }

    if (!response.ok) {

        throw new Error(
            data.detail ||
            "Server error"
        );
    }

    return data;
}


/* =========================================================
   JOIN
========================================================= */

async function joinGame() {

    try {

        const data =
            await api(
                "/join",
                {
                    method: "POST",

                    body:
                        JSON.stringify({

                            user_id:
                                userId,

                            name:
                                userName

                        })
                }
            );

        setStatus(
            "Connected",
            true
        );

        return data;

    } catch (error) {

        console.error(
            "JOIN ERROR:",
            error
        );

        setStatus(
            "Offline",
            false
        );

        throw error;
    }
}


/* =========================================================
   REFRESH
========================================================= */

async function refreshGame() {

    try {

        const data =
            await api(
                "/game?user_id=" +
                encodeURIComponent(
                    userId
                )
            );

        gameState = data;

        setStatus(
            "Connected",
            true
        );

        renderGame(data);

    } catch (error) {

        console.error(
            "REFRESH ERROR:",
            error
        );

        setStatus(
            "Offline",
            false
        );
    }
}


/* =========================================================
   START GAME
========================================================= */

async function startGame() {

    try {

        setLoading(true);

        await joinGame();

        const data =
            await api(
                "/start",
                {
                    method: "POST"
                }
            );

        gameState = data;

        renderGame(data);

        document
            .getElementById(
                "startScreen"
            )
            .classList.add(
                "hidden"
            );

        showToast(
            "♠ Game started!"
        );

    } catch (error) {

        console.error(error);

        showToast(
            error.message
        );

    } finally {

        setLoading(false);
    }
}


/* =========================================================
   ACTION
========================================================= */

async function doAction(
    action
) {

    if (!gameState)
        return;

    if (!gameState.started) {

        showToast(
            "Game is not running"
        );

        return;
    }

    if (
        gameState.current_player !==
        userId
    ) {

        showToast(
            "It's not your turn"
        );

        return;
    }

    try {

        setLoading(true);

        const data =
            await api(
                "/action",
                {
                    method: "POST",

                    body:
                        JSON.stringify({

                            user_id:
                                userId,

                            action:
                                action,

                            amount: 0

                        })
                }
            );

        gameState = data;

        renderGame(data);

    } catch (error) {

        showToast(
            error.message
        );

    } finally {

        setLoading(false);
    }
}


/* =========================================================
   RAISE
========================================================= */

async function raiseAction() {

    if (!gameState)
        return;

    if (
        gameState.current_player !==
        userId
    ) {

        showToast(
            "It's not your turn"
        );

        return;
    }

    const current =
        Number(
            gameState.current_bet ||
            20
        );

    const amount =
        prompt(
            "Raise to:",
            String(
                current + 20
            )
        );

    if (!amount)
        return;

    const raiseTo =
        Number(amount);

    if (
        !Number.isFinite(
            raiseTo
        )
    ) {

        showToast(
            "Invalid amount"
        );

        return;
    }

    try {

        setLoading(true);

        const data =
            await api(
                "/action",
                {
                    method: "POST",

                    body:
                        JSON.stringify({

                            user_id:
                                userId,

                            action:
                                "raise",

                            amount:
                                raiseTo

                        })
                }
            );

        gameState = data;

        renderGame(data);

    } catch (error) {

        showToast(
            error.message
        );

    } finally {

        setLoading(false);
    }
}


/* =========================================================
   CARD
========================================================= */

function createCard(
    card,
    small = false
) {

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "card" +
        (
            small
                ? " small"
                : ""
        );

    if (
        card &&
        (
            card.includes("♥") ||
            card.includes("♦")
        )
    ) {

        div.classList.add(
            "red"
        );
    }

    div.innerText =
        card || "?";

    return div;
}


function createBack(
    small = false
) {

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "card back" +
        (
            small
                ? " small"
                : ""
        );

    div.innerText = "♠";

    return div;
}


/* =========================================================
   PLAYER RENDER
========================================================= */

function renderPlayers(
    players
) {

    for (
        let seat = 0;
        seat < 6;
        seat++
    ) {

        const box =
            document.getElementById(
                "seat" + seat
            );

        box.innerHTML = "";

        box.classList.remove(
            "me",
            "turn",
            "folded"
        );

        const player =
            players.find(
                p =>
                    Number(p.seat) ===
                    seat
            );

        if (!player)
            continue;

        if (
            player.user_id ===
            userId
        ) {

            box.classList.add(
                "me"
            );
        }

        if (player.is_turn) {

            box.classList.add(
                "turn"
            );
        }

        if (player.folded) {

            box.classList.add(
                "folded"
            );
        }

        const container =
            document.createElement(
                "div"
            );

        container.className =
            "player-box";

        /* NAME */

        const name =
            document.createElement(
                "div"
            );

        name.className =
            "player-name";

        name.innerText =
            player.name;

        if (player.is_bot) {

            const bot =
                document.createElement(
                    "span"
                );

            bot.className =
                "bot-badge";

            bot.innerText = "🤖";

            name.appendChild(
                bot
            );
        }

        /* CHIPS */

        const chips =
            document.createElement(
                "div"
            );

        chips.className =
            "player-chips";

        chips.innerText =
            "🪙 " +
            Number(
                player.chips || 0
            ).toLocaleString();

        /* CARDS */

        const cards =
            document.createElement(
                "div"
            );

        cards.className =
            "player-cards";

        if (
            player.user_id !==
            userId &&
            player.cards_count >= 2
        ) {

            cards.appendChild(
                createBack(true)
            );

            cards.appendChild(
                createBack(true)
            );
        }

        container.appendChild(
            name
        );

        container.appendChild(
            chips
        );

        container.appendChild(
            cards
        );

        /* TIMER */

        if (
            player.is_turn &&
            !player.is_bot
        ) {

            const timer =
                document.createElement(
                    "div"
                );

            timer.className =
                "turn-timer";

            timer.id =
                "playerTimer";

            timer.innerText =
                TURN_SECONDS;

            container.appendChild(
                timer
            );
        }

        box.appendChild(
            container
        );
    }
}


/* =========================================================
   COMMUNITY
========================================================= */

function renderCommunity(
    cards
) {

    const container =
        document.getElementById(
            "community"
        );

    container.innerHTML = "";

    cards.forEach(
        card => {

            container.appendChild(
                createCard(card)
            );

        }
    );
}


/* =========================================================
   MY CARDS
========================================================= */

function renderMyCards(
    cards
) {

    const container =
        document.getElementById(
            "myCards"
        );

    container.innerHTML = "";

    if (
        cards &&
        cards.length
    ) {

        cards.forEach(
            card => {

                container.appendChild(
                    createCard(card)
                );

            }
        );

    } else {

        container.appendChild(
            createBack()
        );

        container.appendChild(
            createBack()
        );
    }
}


/* =========================================================
   TIMER
========================================================= */

function updateTimer() {

    const timer =
        document.getElementById(
            "playerTimer"
        );

    if (
        !timer ||
        !gameState ||
        !gameState.started ||
        !gameState.turn_started_at
    ) {
        return;
    }

    const elapsed =
        Math.floor(
            Date.now() / 1000 -
            Number(
                gameState.turn_started_at
            )
        );

    let remaining =
        TURN_SECONDS -
        elapsed;

    if (remaining < 0)
        remaining = 0;

    timer.innerText =
        remaining;

    if (remaining <= 5) {

        timer.classList.add(
            "danger"
        );

    } else {

        timer.classList.remove(
            "danger"
        );
    }
}


/* =========================================================
   TIMER LOOP
========================================================= */

function startTimerLoop() {

    if (timerTimer)
        clearInterval(
            timerTimer
        );

    timerTimer =
        setInterval(
            updateTimer,
            250
        );
}


/* =========================================================
   GAME RENDER
========================================================= */

function renderGame(
    data
) {

    if (!data)
        return;

    document.getElementById(
        "pot"
    ).innerText =
        Number(
            data.pot || 0
        ).toLocaleString();

    document.getElementById(
        "stage"
    ).innerText =
        String(
            data.stage ||
            "waiting"
        ).toUpperCase();

    renderPlayers(
        data.players || []
    );

    renderCommunity(
        data.community_cards || []
    );

    renderMyCards(
        data.my_cards || []
    );

    /* BUTTONS */

    const myTurn =
        data.current_player ===
        userId;

    const buttons =
        document.querySelectorAll(
            ".actions button"
        );

    buttons.forEach(
        button => {

            button.disabled =
                !myTurn ||
                !data.started;

        }
    );

    document.getElementById(
        "allinBtn"
    ).disabled =
        !myTurn ||
        !data.started;

    /* START SCREEN */

    if (data.started) {

        document
            .getElementById(
                "startScreen"
            )
            .classList.add(
                "hidden"
            );
    }

    /* HAND FINISHED */

    if (
        !data.started &&
        data.winner
    ) {

        showToast(
            data.message ||
            "Hand finished"
        );
    }

    updateTimer();
}


/* =========================================================
   POLLING
========================================================= */

function startPolling() {

    if (pollTimer)
        clearInterval(
            pollTimer
        );

    /*
       Polling keeps the table synchronized
       even when WebSocket is unavailable.
    */

    pollTimer =
        setInterval(
            refreshGame,
            1000
        );
}


/* =========================================================
   INIT
========================================================= */

async function init() {

    getTelegramUser();

    startTimerLoop();

    try {

        await joinGame();

        await refreshGame();

        startPolling();

    } catch (error) {

        console.error(
            "INIT ERROR:",
            error
        );

        showToast(
            "Unable to connect"
        );
    }
}


/* =========================================================
   START
========================================================= */

init();

</script>

</body>
</html>
